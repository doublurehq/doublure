name: doublure deploy
description: Deploy this pull request's service to its doublure preview by calling POST /v1/deploy.

inputs:
  url:
    description: doublure base URL, without /v1/deploy. A trailing / is stripped.
    required: true
  token:
    description: doublure deploy token.
    required: true
  service:
    description: Service key in the doublure catalog.
    required: true
  commit-sha:
    description: Commit SHA to deploy. Defaults to the pull request head SHA.
    required: false
    default: ""

outputs:
  preview-slug:
    description: Slug of the preview the service was deployed to.
    value: ${{ steps.deploy.outputs.preview-slug }}
  gitops-commit-url:
    description: URL of the gitops commit that pinned the service.
    value: ${{ steps.deploy.outputs.gitops-commit-url }}

runs:
  using: composite
  steps:
    - id: deploy
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        DOUBLURE_URL: ${{ inputs.url }}
        DOUBLURE_TOKEN: ${{ inputs.token }}
        SERVICE: ${{ inputs.service }}
        HEAD_REF: ${{ github.head_ref }}
        COMMIT_SHA: ${{ inputs.commit-sha || github.event.pull_request.head.sha }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ "$EVENT_NAME" != pull_request ]; then
          echo "::notice::doublure deploy skipped: not a pull_request event"
          exit 0
        fi
        set -euo pipefail

        if [ -z "$DOUBLURE_TOKEN" ]; then
          echo "::error::doublure deploy: token is required"
          exit 1
        fi
        echo "::add-mask::$DOUBLURE_TOKEN"
        if [ -z "$DOUBLURE_URL" ]; then
          echo "::error::doublure deploy: url is required"
          exit 1
        fi
        if [ -z "$SERVICE" ]; then
          echo "::error::doublure deploy: service is required"
          exit 1
        fi

        body=$(jq -nc \
          --arg service "$SERVICE" \
          --arg head_ref "$HEAD_REF" \
          --arg commit_sha "$COMMIT_SHA" \
          --arg pr_author "$PR_AUTHOR" \
          --arg pr_url "$PR_URL" \
          --arg pr_number "$PR_NUMBER" \
          --arg workflow_run_url "$WORKFLOW_RUN_URL" \
          '{service: $service, head_ref: $head_ref, commit_sha: $commit_sha, pr_author: $pr_author,
            pr_url: $pr_url, pr_number: $pr_number, workflow_run_url: $workflow_run_url}')

        curl_err=$(mktemp)
        if [ -n "${RUNNER_TEMP:-}" ]; then
          response_file="$RUNNER_TEMP/doublure-response.json"
        else
          response_file=$(mktemp)
        fi
        trap 'rm -f "$curl_err" "$response_file"' EXIT
        # curl resets an output file before each retry, so it holds only the last response.
        if ! curl --silent --show-error --fail-with-body --retry 3 --retry-delay 2 --max-time 60 \
          -o "$response_file" \
          -H "Authorization: Bearer $DOUBLURE_TOKEN" \
          -H "Content-Type: application/json" \
          --data "$body" \
          "${DOUBLURE_URL%/}/v1/deploy" 2>"$curl_err"; then
          response=$(cat "$response_file" 2>/dev/null || true)
          msg=$(jq -r '.error // empty' <<<"$response" 2>/dev/null || true)
          [ -n "$msg" ] || msg=$response
          [ -n "$msg" ] || msg=$(cat "$curl_err")
          echo "::error::doublure deploy failed: ${msg//$'\n'/ }"
          exit 1
        fi
        response=$(cat "$response_file")

        if ! jq -e '(.preview_slug | type == "string" and length > 0)
            and (.gitops_commit_url | type == "string" and length > 0)' <<<"$response" >/dev/null 2>&1; then
          echo "::error::doublure deploy failed: unexpected response: ${response//$'\n'/ }"
          exit 1
        fi

        slug=$(jq -r '.preview_slug' <<<"$response")
        commit_url=$(jq -r '.gitops_commit_url' <<<"$response")
        {
          echo "preview-slug=$slug"
          echo "gitops-commit-url=$commit_url"
        } >>"$GITHUB_OUTPUT"
        echo "doublure preview $slug: $commit_url"
        jq -r '.warnings // [] | .[]' <<<"$response" | while IFS= read -r warning; do
          echo "::warning::doublure: $warning"
        done
        echo "doublure preview \`$slug\` · [gitops commit]($commit_url)" >>"$GITHUB_STEP_SUMMARY"
