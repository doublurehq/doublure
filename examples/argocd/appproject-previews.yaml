apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: previews
  namespace: argocd
spec:
  description: Parent project for preview environment ApplicationSet
  sourceRepos:
    - "https://github.com/doublurehq/demo-gitops.git"
    - "oci://ghcr.io/doublurehq/charts/*"
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: "preview-*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: argoproj.io
      kind: AppProject
