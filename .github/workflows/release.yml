name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/doublurehq/doublure
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  charts:
    needs: [release-please, image]
    if: ${{ !cancelled() && needs.release-please.result == 'success' && needs.image.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || github.sha }}

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish charts missing from the registry
        env:
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
        run: |
          for c in charts/*/; do
            name=$(helm show chart "$c" | awk '/^name:/ {print $2}')
            version=$(helm show chart "$c" | awk '/^version:/ {print $2}')
            if [ "$name" = doublure ] && [ "$RELEASE_CREATED" != true ]; then
              echo "doublure chart is published only with a release"
              continue
            fi
            if out=$(helm show chart "oci://ghcr.io/doublurehq/charts/$name" --version "$version" 2>&1); then
              echo "$name $version already published"
              continue
            fi
            if ! echo "$out" | grep -qE ': not found|denied'; then
              echo "::error::cannot check $name $version: $out"
              exit 1
            fi
            helm package "$c" -d "$RUNNER_TEMP/charts"
            helm push "$RUNNER_TEMP/charts/$name-$version.tgz" oci://ghcr.io/doublurehq/charts
          done
