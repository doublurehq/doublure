name: Deploy action

on:
  pull_request:
    paths:
      - "actions/deploy/**"
      - ".github/workflows/deploy-action.yml"

permissions:
  contents: read

concurrency:
  group: deploy-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-action:
    runs-on: ubuntu-24.04
    env:
      STUB_DIR: /tmp/doublure-stub
    steps:
      - uses: actions/checkout@v7

      - name: Extract the action script
        run: |
          set -euo pipefail
          mkdir -p "$STUB_DIR"
          yq '.runs.steps[] | select(.id == "deploy") | .run' actions/deploy/action.yml >"$STUB_DIR/deploy.sh"
          [ -s "$STUB_DIR/deploy.sh" ] || { echo "::error::no deploy script in actions/deploy/action.yml"; exit 1; }
          cat >"$STUB_DIR/lib.sh" <<'EOF'
          fail() { echo "::error::$1"; exit 1; }

          # Runs the action script as the composite step does; sets status and keeps its log and outputs.
          run_action() {
            rm -rf "$STUB_DIR/run"
            mkdir "$STUB_DIR/run"
            : >"$STUB_DIR/run/output"
            status=0
            env EVENT_NAME=pull_request DOUBLURE_URL="$1" DOUBLURE_TOKEN=acme-token SERVICE=acme \
              HEAD_REF= COMMIT_SHA= PR_AUTHOR= PR_URL= PR_NUMBER= WORKFLOW_RUN_URL= \
              GITHUB_OUTPUT="$STUB_DIR/run/output" GITHUB_STEP_SUMMARY="$STUB_DIR/run/summary" \
              bash --noprofile --norc -eo pipefail "$STUB_DIR/deploy.sh" >"$STUB_DIR/run/log" 2>&1 || status=$?
            sed 's/^/| /' "$STUB_DIR/run/log"
          }

          expect_line() {
            grep -qFx -- "$1" "$STUB_DIR/run/log" || fail "missing line in the action log: $1"
          }
          EOF

      - name: Start stub server
        run: |
          mkdir -p "$STUB_DIR"
          cat >"$STUB_DIR/stub.py" <<'EOF'
          import json, os, sys
          from http.server import BaseHTTPRequestHandler, HTTPServer

          out = sys.argv[1]
          # /flaky alternates: 502 on the first hit, 200 on the next.
          flaky = {"fail": False}

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get("Content-Length", 0)))
                  for name, value in (("path", self.path.encode()),
                                      ("auth", self.headers.get("Authorization", "").encode()),
                                      ("body", body)):
                      with open(os.path.join(out, name), "wb") as f:
                          f.write(value)
                  if self.path == "/v1/deploy":
                      code, resp = 200, {"preview_slug": "acme-slug",
                                         "gitops_commit_url": "https://example.com/acme/commit/1",
                                         "warnings": ["acme warning"]}
                  elif self.path == "/fail/v1/deploy":
                      code, resp = 404, {"error": 'service "acme" not in catalog'}
                  elif self.path == "/empty/v1/deploy":
                      code, resp = 200, {}
                  elif self.path == "/flaky/v1/deploy":
                      flaky["fail"] = not flaky["fail"]
                      if flaky["fail"]:
                          code, resp = 502, "<html>\n<body>502 Bad Gateway</body>\n</html>"
                      else:
                          code, resp = 200, {"preview_slug": "acme-slug",
                                             "gitops_commit_url": "https://example.com/acme/commit/1"}
                  elif self.path == "/html/v1/deploy":
                      code, resp = 200, "<html>\n<body>ok</body>\n</html>"
                  else:
                      code, resp = 500, {"error": "unexpected path"}
                  data = (resp if isinstance(resp, str) else json.dumps(resp)).encode()
                  self.send_response(code)
                  self.send_header("Content-Type", "text/html" if isinstance(resp, str) else "application/json")
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)

          HTTPServer(("127.0.0.1", 8099), Handler).serve_forever()
          EOF
          python3 "$STUB_DIR/stub.py" "$STUB_DIR" >"$STUB_DIR/log" 2>&1 &
          for _ in $(seq 50); do
            curl -s -o /dev/null http://127.0.0.1:8099/ && exit 0
            sleep 0.2
          done
          echo "::error::stub server did not start"
          cat "$STUB_DIR/log"
          exit 1

      - name: "Case 1: deploy"
        id: ok
        uses: ./actions/deploy
        with:
          url: http://127.0.0.1:8099/
          token: acme-token
          service: acme

      - name: "Case 1: assert request and outputs"
        env:
          HEAD_REF: ${{ github.head_ref }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLUG: ${{ steps.ok.outputs.preview-slug }}
          COMMIT_URL: ${{ steps.ok.outputs.gitops-commit-url }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$(cat "$STUB_DIR/path")" = /v1/deploy ] || fail "unexpected path: $(cat "$STUB_DIR/path")"
          [ "$(cat "$STUB_DIR/auth")" = "Bearer acme-token" ] || fail "unexpected Authorization header"
          # shellcheck disable=SC2016
          jq -e \
            --arg head_ref "$HEAD_REF" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg pr_author "$PR_AUTHOR" \
            --arg pr_url "$PR_URL" \
            --arg pr_number "$PR_NUMBER" \
            --arg workflow_run_url "$WORKFLOW_RUN_URL" \
            '. == {service: "acme", head_ref: $head_ref, commit_sha: $commit_sha, pr_author: $pr_author,
                   pr_url: $pr_url, pr_number: $pr_number, workflow_run_url: $workflow_run_url}' \
            "$STUB_DIR/body" >/dev/null || { cat "$STUB_DIR/body"; fail "unexpected request body"; }
          [ "$SLUG" = acme-slug ] || fail "unexpected preview-slug output: $SLUG"
          [ "$COMMIT_URL" = https://example.com/acme/commit/1 ] || fail "unexpected gitops-commit-url output: $COMMIT_URL"

      - name: "Case 1: assert the warning is emitted"
        run: |
          set -euo pipefail
          . "$STUB_DIR/lib.sh"
          run_action http://127.0.0.1:8099/
          [ "$status" -eq 0 ] || fail "expected the deploy to succeed, got exit $status"
          expect_line "::warning::doublure: acme warning"

      - name: "Case 2: deploy against a 404"
        id: fail
        continue-on-error: true
        uses: ./actions/deploy
        with:
          url: http://127.0.0.1:8099/fail
          token: acme-token
          service: acme

      - name: "Case 2: assert the step failed with the server's error"
        env:
          OUTCOME: ${{ steps.fail.outcome }}
        run: |
          set -euo pipefail
          . "$STUB_DIR/lib.sh"
          [ "$OUTCOME" = failure ] || fail "expected the 404 deploy to fail, got outcome $OUTCOME"
          run_action http://127.0.0.1:8099/fail
          [ "$status" -ne 0 ] || fail "expected the 404 deploy to fail"
          expect_line '::error::doublure deploy failed: service "acme" not in catalog'

      - name: "Case 3: no expression inside run in action.yml"
        if: always()
        run: |
          set -euo pipefail
          scripts=$(yq '.runs.steps[] | select(has("run")) | .run' actions/deploy/action.yml)
          if [ -z "$scripts" ]; then
            echo "::error::no run script found in actions/deploy/action.yml"
            exit 1
          fi
          if grep -nE '\$\{\{' <<<"$scripts"; then
            echo "::error::actions/deploy/action.yml interpolates an expression inside run; pass it through env"
            exit 1
          fi

      - name: "Case 4: assert an unexpected 2xx body fails without outputs"
        run: |
          set -euo pipefail
          . "$STUB_DIR/lib.sh"
          for path in html empty; do
            run_action "http://127.0.0.1:8099/$path"
            [ "$status" -ne 0 ] || fail "$path: expected the deploy to fail"
            grep -q '^::error::doublure deploy failed: unexpected response: ' "$STUB_DIR/run/log" \
              || fail "$path: missing unexpected response error"
            [ ! -s "$STUB_DIR/run/output" ] || fail "$path: outputs were written"
          done

      - name: "Case 5: deploy through a retried 502"
        id: flaky
        uses: ./actions/deploy
        with:
          url: http://127.0.0.1:8099/flaky
          token: acme-token
          service: acme

      - name: "Case 5: assert outputs"
        env:
          SLUG: ${{ steps.flaky.outputs.preview-slug }}
          COMMIT_URL: ${{ steps.flaky.outputs.gitops-commit-url }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$SLUG" = acme-slug ] || fail "unexpected preview-slug output: $SLUG"
          [ "$COMMIT_URL" = https://example.com/acme/commit/1 ] || fail "unexpected gitops-commit-url output: $COMMIT_URL"
