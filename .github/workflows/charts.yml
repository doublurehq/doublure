name: Charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "examples/**"
      - "internal/preview/testdata/**"
      - "ct.yaml"
      - ".github/workflows/charts.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: helm lint
        run: for c in charts/*/; do helm lint "$c" -f "$c/ci/test-values.yaml"; done

      - name: ct lint (all charts)
        run: |
          docker run --rm -v "$PWD":/w -w /w quay.io/helmpack/chart-testing:v3.15.0 \
            sh -c 'git config --global --add safe.directory /w && ct lint --config ct.yaml --all'

      - name: ct lint (version bump on changed charts)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -v "$PWD":/w -w /w quay.io/helmpack/chart-testing:v3.15.0 \
            sh -c 'git config --global --add safe.directory /w && ct lint --config ct.yaml --excluded-charts doublure'

      - name: Render preview-env with doublure values
        run: |
          out=$(helm template preview-x charts/preview-env -f internal/preview/testdata/values.golden.yaml -f - <<'EOF'
          serviceRepos:
            backend-1: https://github.com/acme/backend-1.git
            backend-2: https://github.com/acme/backend-2.git
            front: https://github.com/acme/front.git
          EOF
          )
          echo "$out" | grep -q 'preview.doublure.dev/pr-url'

      - name: Render preview-env with per-preview hosts
        run: |
          out=$(helm template feature-pricing charts/preview-env -f - <<'EOF'
          serviceRepos:
            backend-1: https://github.com/acme/backend-1.git
            backend-2: https://github.com/acme/backend-2.git
            front: https://github.com/acme/front.git
          services:
            - name: backend-1
              commitSha: abc123
            - name: backend-2
            - name: front
          preview:
            domain: 127.0.0.1.nip.io
            tls: false
            expose:
              front: {}
              backend-1:
                path: /docs
          EOF
          )
          got=$(echo "$out" | yq -N 'select(.kind == "Application") | .metadata.name as $app | .spec.source.helm.parameters[] | select(.name == "app.ingress.host") | $app + " " + .value')
          want='feature-pricing-backend-1 backend-1-feature-pricing.127.0.0.1.nip.io
          feature-pricing-front front-feature-pricing.127.0.0.1.nip.io'
          if [ "$got" != "$want" ]; then
            echo "::error::unexpected app.ingress.host parameters"
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi

      - name: Render doublure with all components
        run: helm template t charts/doublure -f charts/doublure/ci/test-values.yaml --set ingress.enabled=true,ingress.host=doublure.example.com,cleanup.enabled=true

      - name: Render doublure with numeric github ids
        run: |
          out=$(helm template t charts/doublure -f - <<'EOF'
          config:
            githubAppId: 1234567
            githubInstallationId: 87654321
            gitopsRepo: example/gitops
          existingSecret: doublure
          EOF
          )
          echo "$out" | grep -q 'value: "1234567"'
          echo "$out" | grep -q 'value: "87654321"'

      - name: Render doublure without required values fails
        run: |
          if out=$(helm template t charts/doublure 2>&1); then
            echo "::error::expected render to fail without required values"
            exit 1
          fi
          echo "$out" | grep -q 'existingSecret is required'
