name: Charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "examples/**"
      - "internal/preview/testdata/**"
      - "ct.yaml"
      - ".github/workflows/charts.yml"
  pull_request:
    paths:
      - "charts/**"
      - "examples/**"
      - "internal/preview/testdata/**"
      - "ct.yaml"
      - ".github/workflows/charts.yml"

permissions:
  contents: read

concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5

      - uses: helm/chart-testing-action@v2

      - name: helm lint
        run: for c in charts/*/; do helm lint "$c" -f "$c/ci/test-values.yaml"; done

      - name: ct lint
        run: ct lint --config ct.yaml --all

      - name: Render preview-env with doublure values
        run: |
          out=$(helm template preview-x charts/preview-env -f examples/argocd/services.yaml -f internal/preview/testdata/values.golden.yaml)
          echo "$out" | grep -q 'preview.doublure.dev/pr-url'
          ! echo "$out" | grep -q 'akpe'

      - name: Render doublure with all components
        run: helm template t charts/doublure -f charts/doublure/ci/test-values.yaml --set ingress.enabled=true,ingress.host=doublure.example.com,cleanup.enabled=true

      - name: Render doublure without required values fails
        run: "! helm template t charts/doublure 2>/dev/null"
