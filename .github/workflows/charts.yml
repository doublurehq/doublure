name: Charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "examples/**"
      - "internal/preview/testdata/**"
      - "ct.yaml"
      - ".github/workflows/charts.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: helm lint
        run: for c in charts/*/; do helm lint "$c" -f "$c/ci/test-values.yaml"; done

      - name: ct lint (all charts)
        run: |
          docker run --rm -v "$PWD":/w -w /w quay.io/helmpack/chart-testing:v3.15.0 \
            sh -c 'git config --global --add safe.directory /w && ct lint --config ct.yaml --all'

      - name: ct lint (version bump on changed charts)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -v "$PWD":/w -w /w quay.io/helmpack/chart-testing:v3.15.0 \
            sh -c 'git config --global --add safe.directory /w && ct lint --config ct.yaml --excluded-charts doublure'

      - name: Render app with envFrom and initContainers
        run: |
          deploy=$(helm template backend-1 charts/app -f charts/app/ci/test-values.yaml | yq -N 'select(.kind == "Deployment")')
          got=$(echo "$deploy" | yq -N '.spec.template.spec.initContainers[] | select(.name == "acme-init") | .image')
          if [ "$got" != 'ghcr.io/acme/backend-1:latest' ]; then
            echo '::error::expected init container acme-init to render image ghcr.io/acme/backend-1:latest through tpl'
            printf 'got: %s\n' "$got"
            exit 1
          fi
          got=$(echo "$deploy" | yq -N '.spec.template.spec.containers[0].envFrom[0].secretRef.name')
          if [ "$got" != 'acme-db' ]; then
            echo '::error::expected envFrom[0].secretRef.name "acme-db" on the main container'
            printf 'got: %s\n' "$got"
            exit 1
          fi
          got=$(echo "$deploy" | yq -N '[.spec.template.spec.initContainers[] | select(.name == "pg-setup" or .name == "migrate")] | length')
          if [ "$got" != '0' ]; then
            echo '::error::expected no pg-setup or migrate init containers'
            exit 1
          fi

      - name: Render preview-env with doublure values
        run: |
          out=$(helm template preview-x charts/preview-env -f internal/preview/testdata/values.golden.yaml -f - <<'EOF'
          serviceRepos:
            backend-1: https://github.com/acme/backend-1.git
            backend-2: https://github.com/acme/backend-2.git
            front: https://github.com/acme/front.git
          EOF
          )
          echo "$out" | grep -q 'preview.doublure.dev/pr-url'

      - name: Render preview-env with YAML 1.1 ambiguous metadata
        run: |
          out=$(helm template preview-x charts/preview-env -f - <<'EOF'
          serviceRepos:
            backend-1: https://github.com/acme/backend-1.git
          services:
            - name: backend-1
              commitSha: abc123
              metadata:
                pr-author: "Y"
                pr-url: https://github.com/acme/backend-1/pull/42
                pr-number: "0x1F"
                created-at: "2026-05-26"
                updated-at: "2026-05-26T10:00:00Z"
                vcs.ref.name: "on"
                cicd.pipeline.run.url: https://github.com/acme/backend-1/actions/runs/1
          EOF
          )
          got=$(echo "$out" | yq -N 'select(.kind == "Application") | .metadata.annotations | (.["preview.doublure.dev/pr-author"], .["preview.doublure.dev/pr-number"], .["preview.doublure.dev/created-at"], .["preview.doublure.dev/vcs.ref.name"])')
          want='Y
          0x1F
          2026-05-26
          on'
          if [ "$got" != "$want" ]; then
            echo "::error::metadata annotations do not match the original strings"
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi

      - name: Render preview-env with doublure-written hosts
        run: |
          out=$(helm template feature-pricing charts/preview-env -f - <<'EOF'
          serviceRepos:
            backend-1: https://github.com/acme/backend-1.git
            backend-2: https://github.com/acme/backend-2.git
            front: https://github.com/acme/front.git
          services:
            - name: backend-1
              commitSha: abc123
              host: backend-1-feature-pricing.127.0.0.1.nip.io
            - name: backend-2
            - name: front
              host: front-feature-pricing.127.0.0.1.nip.io
          EOF
          )
          # shellcheck disable=SC2016
          got=$(echo "$out" | yq -N 'select(.kind == "Application") | .metadata.name as $app | .spec.source.helm.parameters[] | select(.name == "app.ingress.host") | $app + " " + .value')
          want='feature-pricing-backend-1 backend-1-feature-pricing.127.0.0.1.nip.io
          feature-pricing-front front-feature-pricing.127.0.0.1.nip.io'
          if [ "$got" != "$want" ]; then
            echo "::error::unexpected app.ingress.host parameters"
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi

      - name: Render preview-env with serviceCharts overrides
        run: |
          out=$(helm template preview-x charts/preview-env -f - <<'EOF'
          serviceRepos:
            api: https://github.com/acme/api.git
            front: https://github.com/acme/front.git
          services:
            - name: api
              host: api-x.example.com
            - name: front
              commitSha: abc123
          serviceCharts:
            api:
              branch: master
              path: deploy/helm
              imageTagParam: image.tag
              hostParam: ingress.hostname
              valueFiles: [values-preview.yaml]
            front:
              branch: release
          EOF
          )
          got=$(echo "$out" | yq -N 'select(.kind == "Application") | .metadata.name + " " + .spec.source.targetRevision + " " + .spec.source.path + " " + (.spec.source.helm.valueFiles // "absent" | to_json(0)) + " " + ([.spec.source.helm.parameters[] | .name + "=" + .value] | join(","))')
          # shellcheck disable=SC2016
          want='preview-x-api master deploy/helm ["values-preview.yaml"] image.tag=$ARGOCD_APP_REVISION,ingress.hostname=api-x.example.com
          preview-x-front abc123 k8s/ "absent" app.image.tag=abc123'
          if [ "$got" != "$want" ]; then
            echo "::error::serviceCharts overrides do not render as expected"
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi

      - name: Render doublure with all components
        run: helm template t charts/doublure -f charts/doublure/ci/test-values.yaml --set ingress.enabled=true,ingress.host=doublure.example.com,cleanup.enabled=true

      - name: Render doublure cleanup TTL
        run: |
          # Prints "CronJob:" then its CLEANUP_TTL as "<tag> <value>"; nothing without a CronJob.
          ttl_env() {
            helm template t charts/doublure -f charts/doublure/ci/test-values.yaml --set "cleanup.enabled=true$1" \
              | yq -N 'select(.kind == "CronJob") | .kind + ":" + ([.spec.jobTemplate.spec.template.spec.containers[0].env[] | select(.name == "CLEANUP_TTL") | .value | tag + " " + .] | join(","))'
          }
          got=$(ttl_env ,cleanup.ttl=168h)
          if [ "$got" != 'CronJob:!!str 168h' ]; then
            echo '::error::expected CLEANUP_TTL "168h" on the cleanup CronJob when cleanup.ttl is set'
            printf 'got: %s\n' "$got"
            exit 1
          fi
          got=$(ttl_env "")
          if [ "$got" != 'CronJob:' ]; then
            echo '::error::expected no CLEANUP_TTL on the cleanup CronJob when cleanup.ttl is unset'
            printf 'got: %s\n' "$got"
            exit 1
          fi

      - name: Render doublure with numeric github ids
        run: |
          out=$(helm template t charts/doublure -f - <<'EOF'
          config:
            githubAppId: 1234567
            githubInstallationId: 87654321
            gitopsRepo: example/gitops
          existingSecret: doublure
          EOF
          )
          echo "$out" | grep -q 'value: "1234567"'
          echo "$out" | grep -q 'value: "87654321"'

      - name: Render doublure without required values fails
        run: |
          if out=$(helm template t charts/doublure 2>&1); then
            echo "::error::expected render to fail without required values"
            exit 1
          fi
          echo "$out" | grep -q 'existingSecret is required'
