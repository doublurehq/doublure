{{- range .Values.services }}
{{- $c := index ($.Values.serviceCharts | default dict) .name | default dict }}
{{- $svc := .name }}
{{- range $k := list "branch" "path" "imageTagParam" "hostParam" }}
{{- $v := index $c $k }}
{{- if not (or (kindIs "invalid" $v) (kindIs "string" $v)) }}
{{- fail (printf "serviceCharts.%s.%s must be a string (quote YAML 1.1 booleans such as yes, no, on, off), got %v" $svc $k $v) }}
{{- end }}
{{- end }}
{{- $vf := $c.valueFiles }}
{{- if not (or (kindIs "invalid" $vf) (kindIs "slice" $vf)) }}
{{- fail (printf "serviceCharts.%s.valueFiles must be a list of strings, got %v" $svc $vf) }}
{{- end }}
{{- range ($vf | default list) }}
{{- if not (kindIs "string" .) }}
{{- fail (printf "serviceCharts.%s.valueFiles items must be strings (quote YAML 1.1 booleans such as yes, no, on, off), got %v" $svc .) }}
{{- end }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  namespace: argocd
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: preview-environments
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    preview.doublure.dev/vcs.ref.revision: {{ .commitSha | default "" | quote }}
    {{- if .metadata }}
    preview.doublure.dev/pr-author: {{ index .metadata "pr-author" | quote }}
    preview.doublure.dev/pr-url: {{ index .metadata "pr-url" | quote }}
    preview.doublure.dev/pr-number: {{ index .metadata "pr-number" | quote }}
    preview.doublure.dev/created-at: {{ index .metadata "created-at" | quote }}
    preview.doublure.dev/updated-at: {{ index .metadata "updated-at" | quote }}
    preview.doublure.dev/vcs.ref.name: {{ index .metadata "vcs.ref.name" | quote }}
    preview.doublure.dev/cicd.pipeline.run.url: {{ index .metadata "cicd.pipeline.run.url" | quote }}
    {{- end }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Release.Name }}
  source:
    repoURL: "{{ index $.Values.serviceRepos .name }}"
    targetRevision: {{ if .commitSha }}{{ .commitSha | quote }}{{ else }}{{ $c.branch | default "main" | quote }}{{ end }}
    path: {{ $c.path | default "k8s/" | quote }}
    helm:
      releaseName: {{ .name }}
      {{- with $c.valueFiles }}
      valueFiles:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      parameters:
        - name: {{ $c.imageTagParam | default "app.image.tag" | quote }}
          value: {{ if .commitSha }}{{ .commitSha | quote }}{{ else }}"$ARGOCD_APP_REVISION"{{ end }}
        {{- if .host }}
        - name: {{ $c.hostParam | default "app.ingress.host" | quote }}
          value: {{ .host | quote }}
        {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $.Release.Name }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
---
{{- end }}
