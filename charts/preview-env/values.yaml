# services: list of services to deploy in the preview environment
# Each service can optionally have commitSha (pinned) and metadata (PR info).
#
# services:
#   - name: backend-1
#     commitSha: "abc123"         # optional — pinned to commit SHA (used as targetRevision and image.tag)
#     host: "backend-1-feature-pricing.example.com"   # optional, written by doublure for exposed services; becomes app.ingress.host
#     metadata:                    # optional — only present when service has a PR
#       pr-author: "octocat"
#       pr-url: "https://github.com/doublurehq/demo-backend-1/pull/42"
#       pr-number: "42"
#       created-at: "2026-02-18T14:30:00Z"
#       updated-at: "2026-02-18T16:00:00Z"
#       vcs.ref.name: "feature/add-pricing"
#       cicd.pipeline.run.url: "https://github.com/doublurehq/demo-backend-1/actions/runs/12345"
#   - name: backend-2              # no commitSha → tracks main, no metadata
#   - name: front

services: []

serviceRepos: {}

# Ingress hosts come from each service entry's host, written by doublure from
# the preview block of the gitops repo's services.yaml, and are passed as the
# Helm parameter app.ingress.host. An entry without host gets no ingress host.
# The preview block is doublure's input; this chart does not read it:
#
# preview:
#   domain: 127.0.0.1.nip.io      # lowercase bare domain, parent of every preview host
#   tls: false                    # optional, default true; only picks https/http in doublure's PR-comment links
#   expose:                       # services that get a host; others get none
#     front: {}                   # entry value: empty, {} or {path: ...}
#     backend-1:
#       path: /docs               # optional, default "/"; only used in doublure's PR-comment links
