{{- $name := include "app.name" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: pg-setup
          image: {{ .Values.postgres.initImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            {{- if .Values.postgres.credentialsSecret }}
            - name: PGUSER
              value: "postgres"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecret }}
                  key: superuser-password
            {{- else }}
            - name: PGUSER
              value: {{ .Values.postgres.superuser | quote }}
            - name: PGPASSWORD
              value: {{ .Values.postgres.superuserPassword | quote }}
            {{- end }}
          command:
            - sh
            - -ce
            - |
              echo "Waiting for PostgreSQL..."
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do
                sleep 1
              done

              echo "Creating user {{ $name }} (if not exists)..."
              psql -d postgres -tc "SELECT 1 FROM pg_roles WHERE rolname='{{ $name }}'" | grep -q 1 \
                || psql -d postgres -c "CREATE ROLE \"{{ $name }}\" WITH LOGIN PASSWORD '{{ $name }}';"

              echo "Creating database {{ $name }} (if not exists)..."
              psql -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='{{ $name }}'" | grep -q 1 \
                || psql -d postgres -c "CREATE DATABASE \"{{ $name }}\" OWNER \"{{ $name }}\";"

              echo "pg-setup done."
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - migrate
            - -path
            - {{ .Values.postgres.migrationsPath }}
            - -database
            - {{ printf "postgres://%s:%s@%s:%v/%s?sslmode=disable" $name $name .Values.postgres.host .Values.postgres.port $name | quote }}
            - up
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          env:
            - name: PORT
              value: "{{ .Values.service.port }}"
            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              value: {{ printf "postgres://%s:%s@%s:%v/%s?sslmode=disable" $name $name .Values.postgres.host .Values.postgres.port $name | quote }}
            {{- end }}
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.healthCheck.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.healthCheck.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.readinessProbe.periodSeconds }}
