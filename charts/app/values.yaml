replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 8080

ingress:
  enabled: false
  host: ""
  className: ""

# resources:
#   requests:
#     cpu: 100m
#     memory: 128Mi
#   limits:
#     cpu: 500m
#     memory: 256Mi
resources: {}

healthCheck:
  path: /health
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 3
    periodSeconds: 5

env: {}

# Extra env sources (e.g. a Secret providing DATABASE_URL)
envFrom: []

# Extra init containers; strings are rendered with tpl, so `{{ .Values.image.tag }}` is the service's image tag
initContainers: []
