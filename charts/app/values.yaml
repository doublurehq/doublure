replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 8080

ingress:
  enabled: false
  host: ""
  className: ""

# resources:
#   requests:
#     cpu: 100m
#     memory: 128Mi
#   limits:
#     cpu: 500m
#     memory: 256Mi
resources: {}

healthCheck:
  path: /health
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 3
    periodSeconds: 5

postgres:
  enabled: false
  host: ""
  port: 5432
  superuser: ""
  superuserPassword: ""
  credentialsSecret: ""
  initImage: "postgres:16-alpine"
  migrationsPath: /migrations

env: {}
