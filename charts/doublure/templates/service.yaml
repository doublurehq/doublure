apiVersion: v1
kind: Service
metadata:
  name: {{ include "doublure.fullname" . }}
  labels:
    {{- include "doublure.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "doublure.selectorLabels" . | nindent 4 }}
