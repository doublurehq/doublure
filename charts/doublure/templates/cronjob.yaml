{{- if .Values.cleanup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "doublure.fullname" . }}-cleanup
  labels:
    {{- include "doublure.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cleanup.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # One attempt per run: the next scheduled run is the retry, and a failed
      # pod is kept for its logs.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: cleanup
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "doublure.fullname" . }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "doublure.podSecurityContext" . | nindent 12 }}
          containers:
            - name: cleanup
              image: {{ include "doublure.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["cleanup"]
              env:
                {{- include "doublure.env" . | nindent 16 }}
                {{- with .Values.cleanup.ttl }}
                - name: CLEANUP_TTL
                  value: {{ . | quote }}
                {{- end }}
              {{- with .Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              securityContext:
                {{- include "doublure.containerSecurityContext" . | nindent 16 }}
{{- end }}
